{% extends 'base.html' %}

{% block content %}
<h2>Productos</h2>

<div class="row">
    {% for p in products %}
    <div class="col-md-4">
        <div class="card mb-3">
            <div class="card-body">
                <h5>{{ p.name }}</h5>
                <p>${{ p.price }}</p>
                <a href="/add/{{ p.id }}" class="btn btn-primary">
                    <i class="bi bi-cart-plus"></i> Agregar
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
