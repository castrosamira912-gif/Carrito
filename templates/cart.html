{% extends 'base.html' %}

{% block content %}
<h2>Carrito</h2>

<table class="table">
    <thead>
        <tr>
            <th>Producto</th>
            <th>Precio</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
        <tr>
            <td>{{ p.name }}</td>
            <td>${{ p.price }}</td>
            <td>
                <a href="/remove/{{ loop.index0 }}" class="btn btn-danger">
                    <i class="bi bi-trash"></i>
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<h4>Total: ${{ total }}</h4>

<a href="/" class="btn btn-secondary">Seguir comprando</a>
{% endblock %}
